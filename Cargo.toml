[package]
name = "tora"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A growing collection of handy command-line tools"
repository = "https://github.com/KKyosuke/tora"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dialoguer = { version = "0.12", default-features = false }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
