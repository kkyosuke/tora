name: Release
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Stable tag to create and publish from the triggering commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate and create immutable tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/tag-release.sh
  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: tora-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: tora-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: tora-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/check-release.py
      - run: bash scripts/check.sh
      - run: rustup target add --toolchain stable ${{ matrix.target }}
      - run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package binary and verification files
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: bash scripts/publish-release.sh
